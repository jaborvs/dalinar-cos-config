groups:
  - name: dalinar-host
    rules:
      - alert: HostMemoryPressureHigh
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low available memory on {{ $labels.host }}"
          description: "Less than 10% RAM available for 10 minutes. With no swap cushion, the next step is the OOM-killer."

      - alert: HostOOMKill
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "OOM-kill detected on {{ $labels.host }}"
          description: "The kernel killed a process due to memory pressure in the last 5 minutes."

      - alert: HostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low free space on {{ $labels.mountpoint }} ({{ $labels.host }})"
          description: "Less than 15% free space for 10 minutes."

      - alert: HostHighLoad1
        expr: node_load1 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained high load on {{ $labels.host }}"
          description: "load1 above 1.5x the CPU count for 10 minutes."

  - name: adguard
    rules:
      - alert: AdGuardOOMKilled
        expr: increase(lxd_memory_OOM_kills_total{name="adguard"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "AdGuard container was OOM-killed"
          description: "LAN DNS at risk — check the container status on micro01."

  - name: ceph
    rules:
      - alert: CephHealthError
        expr: ceph_health_status == 2
        labels:
          severity: critical
        annotations:
          summary: "Ceph in HEALTH_ERR"
          description: "ERR state (not WARN) — the WARN from the 1-node/size-1 cluster is the accepted baseline, this is a real problem."

      - alert: CephOSDDown
        expr: ceph_osd_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OSD {{ $labels.ceph_daemon }} down"
          description: "With no swap on micro01, this could be an OOM-killed daemon, not just slowness."

      - alert: CephPGsNotClean
        expr: |
          (ceph_pg_degraded + ceph_pg_undersized + ceph_pg_incomplete
            + ceph_pg_down + ceph_pg_inconsistent + ceph_pg_stale) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Ceph PGs outside active+clean"
          description: "Real risk of data loss/corruption, not the usual cosmetic WARN."

      - alert: CephPoolNearFull
        expr: ceph_cluster_total_used_bytes / ceph_cluster_total_bytes > 0.85
        labels:
          severity: warning
        annotations:
          summary: "Ceph pool above 85% usage"
          description: "The pool has a fixed size, different from the full physical HDD — it can fill up sooner than it looks."

      - alert: CephMetricsAbsent
        expr: absent(ceph_health_status)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ceph stopped reporting metrics"
          description: "It's not that Ceph is broken — Alloy stopped pushing its metrics."
